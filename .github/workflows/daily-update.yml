name: Daily Seagrass Research Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: seagrass-radar-daily
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily literature harvest
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          AI_SUMMARY_LIMIT: "12"
          RETRIEVAL_LOOKBACK_DAYS: "21"
          OPENALEX_PUBLICATION_LOOKBACK_DAYS: "180"
          RETENTION_DAYS: "1095"

        run: python harvest.py

      - name: Commit refreshed data
        run: |
          git config user.name "seagrass-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily literature update $(date -u +%F)"
            git push
          fi
